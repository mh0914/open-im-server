map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream openim_api {
    server 127.0.0.1:10002;
    keepalive 32;
}

upstream openim_msggateway {
    server 127.0.0.1:10001;
    keepalive 32;
}

upstream openim_chat {
    server 127.0.0.1:10008;
    keepalive 32;
}

upstream openim_minio {
    server 127.0.0.1:10005;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 200m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_request_buffering off;

    # Public entry:
    #   http://59.46.214.114:18080  -> SLB -> 192.168.1.16:80
    # Current deployment uses HTTP only. If you later enable TLS on 443/9443,
    # move the same location blocks into an HTTPS server block and change the
    # client endpoints to https:// and wss://.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port 18080;

    location = / {
        default_type text/plain;
        return 200 "openim nginx ok\n";
    }

    location = /api {
        return 301 /api/;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_pass http://openim_api/;
    }

    location = /chat {
        return 301 /chat/;
    }

    location /chat/ {
        proxy_http_version 1.1;
        proxy_pass http://openim_chat/;
    }

    location = /msg_gateway {
        rewrite ^ / break;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_pass http://openim_msggateway;
    }

    location /msg_gateway/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_pass http://openim_msggateway/;
    }

    location = /minio {
        return 301 /minio/;
    }

    location /minio/ {
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_pass http://openim_minio/;
    }

    # Uncomment only if you later decide to expose chat admin APIs to the Internet.
    # location /chat-admin/ {
    #     proxy_http_version 1.1;
    #     proxy_pass http://127.0.0.1:10009/;
    # }
}
